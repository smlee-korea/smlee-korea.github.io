<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <meta name="description" content="직접 만든 앱과 공부 자료를 모아 공유하는 포트폴리오">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 id="site-title">포트폴리오</h1>
      <p id="site-intro" class="intro"></p>
      <nav id="site-links" class="site-links"></nav>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div id="filters" class="filters" role="tablist" aria-label="카테고리"></div>
      <input id="search" class="search" type="search" placeholder="제목, 태그로 검색" aria-label="검색">
    </div>

    <p id="count" class="count"></p>
    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>조건에 맞는 작업물이 없습니다.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap"><span id="footer-text"></span></div>
  </footer>

  <!-- 작업물 상세 보기 창 -->
  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <div class="detail-inner">
      <button class="close" type="button" aria-label="닫기">&times;</button>
      <div id="detail-body"></div>
    </div>
  </dialog>

  <!-- 데이터 파일을 먼저 불러온 뒤 화면을 그린다 -->
  <script src="data/works.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
