<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가계부 대시보드 데모</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2;
    --surface-1: #fcfcfb;
    --surface-2: #f0efec;
    --border: #e3e2de;
    --grid: #e9e8e4;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    --series-1: #2a78d6;
    --future: #e3e2de;
    --good: #006300;
    --bad: #b42323;
    --accent-bg: #eaf2fc;
    --tab-active: #0b0b0b;
    --ok-bg: #e4f5e4; --ok-fg: #006300;
    --half-bg: #fff3d1; --half-fg: #7a5200;
    --fail-bg: #fde6e6; --fail-fg: #b42323;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #111110;
      --surface-1: #1a1a19;
      --surface-2: #232322;
      --border: #2f2f2d;
      --grid: #2a2a28;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --series-1: #3987e5;
      --future: #2f2f2d;
      --good: #4cc24c;
      --bad: #ff7b7b;
      --accent-bg: #16263a;
      --tab-active: #f0efec;
      --ok-bg: #12301a; --ok-fg: #6fd46f;
      --half-bg: #33290f; --half-fg: #f5c451;
      --fail-bg: #3a1a1a; --fail-fg: #ff8a8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text-primary);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 48px; }

  /* 상단 고정 영역: 제목 + 탭 */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: 18px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  header h1 { font-size: 20px; margin: 0 8px 0 0; letter-spacing: -0.01em; }
  select, input, button {
    font: inherit; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { background: var(--surface-2); }
  button:disabled { opacity: .5; cursor: default; }
  .sync { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 12px; }
  nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav.tabs a {
    padding: 10px 14px; color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 14px;
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  nav.tabs a:hover { color: var(--text-primary); }
  nav.tabs a.active { color: var(--tab-active); border-bottom-color: var(--tab-active); }
  nav.tabs .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--accent-bg); color: var(--series-1); font-size: 11px; text-align: center; }
  .month-hint { font-size: 12px; color: var(--text-muted); }

  main { padding-top: 18px; }
  .banner { background: var(--accent-bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; color: var(--text-secondary); }
  .banner b { color: var(--text-primary); }
  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(5, 1fr); margin-bottom: 16px; }
  .two { grid-template-columns: 1fr 1fr; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 2px; }
  .card .sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }
  .kpi .label { font-size: 12px; color: var(--text-secondary); }
  .kpi .value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .note { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .up { color: var(--bad); } .down { color: var(--good); }
  .mt { margin-top: 16px; }
  a.more { font-size: 13px; color: var(--series-1); text-decoration: none; }
  a.more:hover { text-decoration: underline; }

  /* 생활 규칙 */
  .rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .rule { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; background: var(--surface-1); }
  .rule .t { font-weight: 700; font-size: 15px; }
  .rule .e { font-size: 13px; color: var(--text-secondary); margin: 6px 0 10px; }
  .rule .r { font-size: 14px; background: var(--accent-bg); border-radius: 6px; padding: 8px 10px; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 8px 0; }
  .howto { font-size: 13px; color: var(--text-secondary); }
  .howto li { margin: 4px 0; }

  /* 가로 막대 */
  .hbars { display: grid; grid-template-columns: 100px 1fr 160px; gap: 8px 12px; align-items: center; }
  .hbars .name { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbars .track { height: 14px; }
  .hbars .bar { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbars .val { font-size: 12px; color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 세로 막대 */
  .vbars { display: flex; align-items: flex-end; gap: 2px; height: 180px; border-bottom: 1px solid var(--border); }
  .vbars .col { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .vbars .bar { width: 100%; background: var(--series-1); border-radius: 4px 4px 0 0; }
  .vbars .col.future .bar { background: var(--future); }
  .vbars .col:hover .bar { filter: brightness(1.15); }
  .xlabels { display: flex; gap: 2px; margin-top: 4px; }
  .xlabels span { flex: 1; text-align: center; font-size: 11px; color: var(--text-muted); }
  .vbars.wide, .xlabels.wide { gap: 10px; }
  .vbars.wide .col { justify-content: center; }
  .vbars.wide .bar { max-width: 48px; }
  .chart-note { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  /* 목록 */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .list li:last-child { border-bottom: 0; }
  .list .muted { color: var(--text-muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; }
  .stat .label { font-size: 12px; color: var(--text-secondary); }
  .stat .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* 표 */
  .filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .filters input { flex: 1; min-width: 200px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 12px; padding: 7px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface-1); z-index: 1; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .income { color: var(--good); }
  .tbl-wrap { max-height: calc(100vh - 260px); overflow: auto; }
  .tag { font-size: 11px; color: var(--text-muted); }

  /* 시트 (엑셀처럼) */
  .sheet-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--text-primary); color: var(--surface-1); }
  .sheet-bar .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .sheet { border: 1px solid var(--border); border-radius: 8px; overflow: auto; max-height: calc(100vh - 250px); background: var(--surface-1); }
  .sheet table { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
  .sheet th, .sheet td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 5px 8px; white-space: nowrap; }
  .sheet thead th { background: var(--surface-2); color: var(--text-secondary); text-align: center; font-weight: 600; }
  .sheet thead tr.letters th { font-weight: 500; color: var(--text-muted); font-size: 11px; padding: 3px 8px; top: 0; }
  .sheet thead tr.names th { top: 23px; }
  .sheet .rn { position: sticky; left: 0; background: var(--surface-2); color: var(--text-muted); text-align: center; font-size: 11px; min-width: 40px; z-index: 1; }
  .sheet thead .rn { z-index: 3; }
  .sheet tr.example td { color: var(--text-muted); }
  .sheet tr.total td { font-weight: 700; background: var(--surface-2); }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--surface-2); color: var(--text-secondary); }
  .pill.ok { background: var(--accent-bg); color: var(--series-1); }
  .pill.fail { color: var(--bad); }
  .sheet-note { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  /* 챌린지 달력 */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal .wd { text-align: center; font-size: 12px; color: var(--text-muted); padding-bottom: 2px; }
  .cal .wd.sun { color: var(--bad); }
  .cal .cell { min-height: 92px; border-radius: 10px; border: 1px solid var(--border); padding: 8px 9px; display: flex; flex-direction: column; gap: 4px; background: var(--surface-1); }
  .cal .cell.blank { border: 0; background: transparent; }
  .cal .cell .hd { display: flex; justify-content: space-between; align-items: center; }
  .cal .cell .num { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .cal .cell .ico { font-size: 16px; line-height: 1; }
  .cal .cell .amt { margin-top: auto; font-size: 11.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .cal .cell .lbl { font-size: 11px; font-weight: 600; }
  .cal .meter { height: 4px; border-radius: 2px; background: var(--grid); overflow: hidden; }
  .cal .meter i { display: block; height: 100%; border-radius: 2px; background: currentColor; }
  .cal .success { background: var(--ok-bg); border-color: transparent; color: var(--ok-fg); }
  .cal .half { background: var(--half-bg); border-color: transparent; color: var(--half-fg); }
  .cal .fail { background: var(--fail-bg); border-color: transparent; color: var(--fail-fg); }
  .cal .today { border: 2px solid var(--series-1); color: var(--series-1); }
  .cal .future .num, .cal .none .num { color: var(--text-muted); font-weight: 500; }
  .cal .success .num, .cal .half .num, .cal .fail .num, .cal .today .num { color: inherit; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-top: 12px; }
  .ch-kpis { grid-template-columns: repeat(5, 1fr); margin-bottom: 16px; }
  .today-box { border-radius: 10px; padding: 12px 14px; background: var(--accent-bg); margin-bottom: 16px; font-size: 14px; }
  .today-box b { font-size: 18px; }

  #tip { position: fixed; pointer-events: none; background: var(--text-primary); color: var(--surface-1); font-size: 12px; padding: 5px 8px; border-radius: 6px; white-space: pre-line; max-width: 280px; opacity: 0; transition: opacity .08s; z-index: 10; }
  .error { color: var(--bad); padding: 40px; text-align: center; }
  [hidden] { display: none !important; }

  @media (max-width: 900px) { .ch-kpis { grid-template-columns: repeat(2, 1fr); } .cal .cell { min-height: 70px; } .kpis { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr; } }
</style>
</head>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = n => `${Math.round(n).toLocaleString("ko-KR")}원`;
const num = n => (typeof n === "number") ? Math.round(n).toLocaleString("ko-KR") : esc(n ?? "");
const pct = n => `${Math.round(n * 100)}%`;
const TABS = ["summary", "rules", "spending", "patterns", "challenge", "transactions", "sheet"];
let state = { data: null, sheet: null, q: "", cat: "", sheetView: "ledger", year: null };

const tab = () => { const t = location.hash.slice(1).split("/")[0]; return TABS.includes(t) ? t : "summary"; };
// "#sheet/monthly" 처럼 시트 하위 화면도 주소로 바로 열 수 있게
const syncSheetView = () => { const sub = location.hash.split("/")[1]; if (["ledger", "monthly", "raw"].includes(sub)) state.sheetView = sub; };

async function load(month) {
  try {
    const d = await (await fetch("/api/data" + (month ? `?month=${encodeURIComponent(month)}` : ""))).json();
    if (!d.ok) throw new Error(d.error || "알 수 없는 오류");
    state.data = d;
    renderHeader();
    render();
  } catch (e) {
    $("#app").innerHTML = `<div class="error">가계부를 읽지 못했어요.<br><small>${esc(e.message)}</small></div>`;
  }
}

async function loadSheet(year) {
  try {
    const d = await (await fetch("/api/sheet" + (year ? `?year=${year}` : ""))).json();
    if (!d.ok) throw new Error(d.error || "알 수 없는 오류");
    state.sheet = d; state.year = d.year;
    if (tab() === "sheet") render();
  } catch (e) {
    if (tab() === "sheet") $("#app").innerHTML = `<div class="error">시트를 읽지 못했어요.<br><small>${esc(e.message)}</small></div>`;
  }
}

function renderHeader() {
  const d = state.data;
  $("#month").innerHTML = d.months.map(m => {
    const [y, mo] = m.split("-");
    return `<option value="${m}" ${m === d.month ? "selected" : ""}>${y}년 ${+mo}월</option>`;
  }).join("");
  $("#month").hidden = tab() === "sheet";
  $("#syncText").textContent = d.sync.last ? `마지막 동기화 ${d.sync.last.slice(5, 16)} · ${d.sync.message}` : d.sync.message;

  b.hidden = !d.rules.length; b.textContent = d.rules.length;
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("active", a.dataset.tab === tab()));
}

function render() {
  if (!state.data) return;
  renderHeader();
  const t = tab();
  const views = { summary: vSummary, rules: vRules, spending: vSpending, patterns: vPatterns, challenge: vChallenge, transactions: vTransactions, sheet: vSheet };

function vChallenge() {
  const c = state.data.challenge;
  const ICON = { success: "✅", half: "⚠️", fail: "❌", today: "⏳", none: "", future: "" };
  const LABEL = { success: "성공", half: "절반 성공", fail: "초과", today: "진행 중", none: "", future: "" };
  const wds = ["일", "월", "화", "수", "목", "금", "토"];
  const cells = [];
  for (let i = 0; i < c.first_weekday; i++) cells.push(`<div class="cell blank"></div>`);
  for (const x of c.days) {
    const joined = ["success", "half", "fail", "today"].includes(x.status);
    const ratio = joined && x.budget ? Math.min(x.spent / x.budget, 1) : 0;
    const tipLines = joined ? [
      `${+state.data.month.split("-")[1]}월 ${x.day}일 · ${LABEL[x.status]}`,
      `예산 ${won(x.budget)} = 이월 ${won(x.carry_in)} + 오늘 이체 ${won(x.transfer)}`,
      `챌린지 계좌 사용: ${won(x.spent)} → 남은 돈 ${won(Math.max(x.budget - x.spent, 0))}`,
      ...x.items.map(i => `  · ${i}`),
      ...(x.other > 0 ? [`다른 계좌 생활비: ${won(x.other)}`, ...x.other_items.map(i => `  · ${i}`)] : []),
    ] : [x.status === "future" ? "아직 오지 않은 날" : `챌린지를 안 한 날${x.carry_in > 0 ? ` · 남은 돈 ${won(x.carry_in)} 유지` : ""}`];
    cells.push(`<div class="cell ${x.status}" data-tip="${esc(tipLines.join("\n"))}">
      <div class="hd"><span class="num">${x.day}</span><span class="ico">${ICON[x.status]}</span></div>
      ${joined ? `<span class="lbl">${LABEL[x.status]}</span>
        <div class="amt">${num(x.spent)} / ${num(x.budget)}${x.carry_in > 0 ? `<br><span class="tag">이월 ${num(x.carry_in)}</span>` : ""}</div>
        <div class="meter"><i style="width:${(ratio * 100).toFixed(0)}%"></i></div>` : ""}
    </div>`);
  }
  const t = c.today;
  const todayBox = t ? `<div class="today-box">⏳ <b>오늘 쓸 수 있는 돈 ${won(Math.max(t.budget - t.spent, 0))}</b>
      &nbsp;<span class="tag">예산 ${won(t.budget)} (이월 ${won(t.carry_in)} + 오늘 이체 ${won(t.transfer)}) · 사용 ${won(t.spent)}${t.other > 0 ? ` · 다른 계좌에서도 ${won(t.other)} 사용` : ""}</span></div>` : "";
  const empty = c.joined === 0 ? `<div class="banner"><b>이번 달 챌린지 기록이 아직 없어요.</b>
      카카오뱅크에서 만원챌린지 계좌로 돈을 보내면 그날부터 달력에 표시돼요.</div>` : "";
  return `${empty}${todayBox}
    <div class="grid ch-kpis">
      ${kpi("🔥 연속 성공", `${c.streak}일`, `최장 ${c.best}일`)}
      ${kpi("성공률", c.rate == null ? "–" : pct(c.rate), `끝난 날 ${c.success + c.half + c.fail}일 중 성공 ${c.success}일`)}
      ${kpi("참여한 날", `${c.joined}일`, `⚠️ ${c.half}일 · ❌ ${c.fail}일`)}
      ${kpi("하루 평균 사용", c.avg_spent == null ? "–" : won(c.avg_spent), "챌린지 계좌 기준")}
      ${kpi("💰 챌린지 잔액", won(c.balance), c.carry_from_prev > 0 ? `지난달 이월 ${won(c.carry_from_prev)} 포함` : "이월 포함 · 다음 날로 넘어감")}
    </div>
    <section class="card">
      <h2>${monthLabel()} 만원챌린지 달력</h2>
      <p class="sub">날짜에 마우스를 올리면 그날 쓴 내역이 보여요</p>
      <div class="cal">${wds.map((w, i) => `<div class="wd ${i === 0 ? "sun" : ""}">${w}</div>`).join("")}${cells.join("")}</div>
      <div class="legend">
        <span>✅ 성공: 챌린지 계좌 예산 안에서만 씀</span>
        <span>⚠️ 절반 성공: 예산은 지켰지만 다른 계좌에서도 생활비를 씀</span>
        <span>❌ 초과: 챌린지 계좌 지출이 예산을 넘음</span>
        <span>⏳ 진행 중: 오늘</span>
      </div>
      <p class="chart-note">예산 = 전날까지 남은 돈(이월) + 그날 만원챌린지 계좌로 보낸 금액. 남은 돈은 다음 날·다음 달로 넘어가고, 예산을 넘긴 날 다음은 0원부터 다시 시작해요. 월세·통신비·보험·교육 같은 고정지출은 판정에서 빼요.</p>
    </section>`;
}

function bindTransactions() {
  const draw = () => {
    const q = state.q.trim().toLowerCase();
    const rows = state.data.transactions.filter(t =>
      (!state.cat || t.cat === state.cat) && (!q || t.desc.toLowerCase().includes(q) || t.memo.toLowerCase().includes(q)));
    const total = rows.reduce((a, t) => a + (t.kind === "지출" ? t.amount : 0), 0);
    $("#count").textContent = `${rows.length}건 · 지출 합계 ${won(total)}`;
    $("#rows").innerHTML = rows.length ? rows.map(t => `<tr>
        <td>${t.date.slice(5).replace("-", "/")} <span class="tag">${esc(t.time)}</span></td>
        <td>${esc(t.desc)}</td><td class="tag">${esc(t.cat)}</td><td class="tag">${esc(t.method)}</td>
        <td class="num ${t.kind === "수입" ? "income" : ""}">${t.kind === "챌린지" ? "<span class='tag'>챌린지</span> ↪" : (t.kind === "수입" ? "+" : "−")}${won(Math.abs(t.amount))}${t.amount < 0 && t.kind === "지출" ? " <span class='tag'>취소</span>" : ""}</td></tr>`).join("")
      : `<tr><td colspan="5" class="empty">해당하는 거래가 없어요.</td></tr>`;
  };
  $("#q").addEventListener("input", e => { state.q = e.target.value; draw(); });
  $("#cat").addEventListener("change", e => { state.cat = e.target.value; draw(); });
  draw();
}

        : `<tr><td class="rn"></td><td colspan="7" class="empty">아직 기록이 없어요.</td></tr>`}</tbody>
    </table></div>
    <p class="sheet-note">${esc(sh.ledger_name)}의 '가계부' 시트를 그대로 보여줘요 (${sh.rows.length}행). 회색 줄은 템플릿 예시라서 분석에서는 빠져요. 수정하려면 "Numbers에서 열기"를 누르세요.</p>`;
}
function sheetMonthly() {
  const sh = state.sheet;
  const tot = sh.monthly.reduce((a, m) => ({ income: a.income + m.income, expense: a.expense + m.expense }), { income: 0, expense: 0 });
  const rate = r => r == null ? "–" : pct(r);
  const z = v => v ? num(v) : "–";
  const monthTable = `<div class="sheet"><table>
      <thead><tr class="letters"><th class="rn"></th><th>월</th><th class="num">수입</th><th class="num">지출</th><th class="num">수지</th><th class="num">저축률</th><th class="num">누적 수지</th><th class="num">만원챌린지</th></tr></thead>
      <tbody>${sh.monthly.map(m => `<tr><td class="rn">${m.month}</td><td>${m.month}월</td>
        <td class="num">${z(m.income)}</td><td class="num">${z(m.expense)}</td><td class="num">${z(m.net)}</td>
        <td class="num">${rate(m.rate)}</td><td class="num">${z(m.cum)}</td><td class="num">${z(m.challenge)}</td></tr>`).join("")}
        <tr class="total"><td class="rn"></td><td>합계</td><td class="num">${num(tot.income)}</td><td class="num">${num(tot.expense)}</td>
        <td class="num">${num(tot.income - tot.expense)}</td><td class="num">${tot.income ? pct((tot.income - tot.expense) / tot.income) : "–"}</td><td class="num"></td><td class="num">${z(sh.monthly.reduce((a, m) => a + m.challenge, 0))}</td></tr>
      </tbody></table></div>`;
  const catTable = sh.cat_rows.length ? `<div class="sheet"><table>
      <thead><tr class="letters"><th class="rn"></th><th>카테고리</th>${Array.from({ length: 12 }, (_, i) => `<th class="num">${i + 1}월</th>`).join("")}<th class="num">합계</th></tr></thead>
      <tbody>${sh.cat_rows.map((c, i) => `<tr><td class="rn">${i + 1}</td><td>${esc(c.name)}</td>${c.months.map(v => `<td class="num">${v ? num(v) : ""}</td>`).join("")}<td class="num"><b>${num(c.total)}</b></td></tr>`).join("")}</tbody>
    </table></div>` : `<div class="empty">${sh.year}년 지출 기록이 없어요.</div>`;
  return `<h2 style="font-size:15px;margin:4px 0 8px">${sh.year}년 월별 수입·지출</h2>${monthTable}
    <h2 style="font-size:15px;margin:20px 0 8px">${sh.year}년 카테고리별 지출</h2>${catTable}
    <p class="sheet-note">엑셀의 '월별요약' 시트와 같은 계산이에요. 앱에서는 템플릿 예시 줄을 빼고 계산해요. 만원챌린지는 수입·지출과 따로 집계해요.</p>`;
}
function sheetRaw() {
  const sh = state.sheet;
  const cls = s => s === "기록됨" ? "ok" : (s === "해석 실패" ? "fail" : "");
  return `<div class="sheet"><table>
      <thead><tr class="letters"><th class="rn"></th><th>받은 시각</th><th>알림 제목</th><th>알림 내용</th><th>처리</th><th>사유</th></tr></thead>
      <tbody>${sh.raw.length ? sh.raw.map((r, i) => `<tr><td class="rn">${i + 1}</td><td>${esc(r.when)}</td><td>${esc(r.title)}</td>
        <td>${esc(r.text)}</td><td><span class="pill ${cls(r.status)}">${esc(r.status)}</span></td><td class="tag">${esc(r.reason)}</td></tr>`).join("")
        : `<tr><td class="rn"></td><td colspan="5" class="empty">아직 받은 알림이 없어요.</td></tr>`}</tbody>
    </table></div>
    <p class="sheet-note">휴대폰에서 구글 시트를 거쳐 들어온 카카오뱅크 알림 원문이에요 (최근 300건, 최신순). "해석 실패"가 보이면 Claude에게 규칙 보완을 요청하세요.</p>`;
}

/* ---------- 공통 조각 ---------- */
const monthLabel = () => { const [y, m] = state.data.month.split("-"); return `${y}년 ${+m}월`; };
const kpi = (label, value, note) => `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="note">${note}</div></div>`;
const stat = (label, value) => `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div></div>`;
const ruleCard = r => `<div class="rule"><div class="t">${r.icon} ${esc(r.title)}</div><div class="e">${esc(r.evidence)}</div><div class="r">👉 ${esc(r.rule)}</div></div>`;

function hbars(items) {
  const max = Math.max(...items.map(x => x.amount), 1);
  return items.map(x => `
    <div class="name" title="${esc(x.name)}">${esc(x.name)}</div>
    <div class="track" data-tip="${esc(x.name)} · ${x.count}건 · ${won(x.amount)}"><div class="bar" style="width:${(x.amount / max * 100).toFixed(1)}%"></div></div>
    <div class="val">${won(x.amount)} · ${pct(x.share)}</div>`).join("");
}
function vbars(items, wide, labelFn) {
  const max = Math.max(...items.map(x => x.amount), 1);
  const cols = items.map(x => `<div class="col ${x.future ? "future" : ""}" data-tip="${esc(x.tip)}">
      <div class="bar" style="height:${x.future ? "2px" : Math.max(x.amount > 0 ? 1.5 : 0, x.amount / max * 100) + "%"}"></div></div>`).join("");
  const labels = items.map(x => `<span>${labelFn ? labelFn(x) : esc(x.label)}</span>`).join("");
  return `<div class="vbars ${wide ? "wide" : ""}">${cols}</div><div class="xlabels ${wide ? "wide" : ""}">${labels}</div>`;
}

/* ---------- 이벤트 ---------- */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tip.style.opacity = 0; return; }
  tip.textContent = el.dataset.tip; tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = (e.clientY - 34) + "px";
});
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); syncSheetView(); render(); });
$("#month").addEventListener("change", e => load(e.target.value));
$("#syncBtn").addEventListener("click", async () => {
  const btn = $("#syncBtn");
  btn.disabled = true; btn.textContent = "동기화 중…";
  try {
    const r = await (await fetch("/api/sync", { method: "POST" })).json();
    $("#syncText").textContent = r.message || (r.ok ? "완료" : "실패");
  } catch (e) { $("#syncText").textContent = "동기화 실패: " + e.message; }
  btn.disabled = false; btn.textContent = "지금 동기화";
  state.sheet = null;
  load(state.data && state.data.month);
});
setInterval(() => fetch("/api/ping").catch(() => {}), 60000);
syncSheetView();
load();
</script>
</body>
</html>
